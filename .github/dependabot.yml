# Dependabot configuration.
#
# No npm updater: this repository is bun-managed (package.json + bun.lock) and
# the npm ecosystem updater is known to misbehave with bun lockfiles. The `bun`
# ecosystem keeps dev dependencies current; github-actions covers workflow pins.

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
