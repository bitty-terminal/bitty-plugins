# Dependabot configuration.
#
# No npm updater: this repository is bun-managed and the npm ecosystem updater
# is known to misbehave with bun lockfiles. No bun updater either: a trial run
# on this repository failed in the updater container (2026-09-14); tracked as a
# follow-up in TODO.md. The github-actions updater remains enabled.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
