name: Plugin integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Plugin integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Repository existence checks run in Registry check; keep this job
      # hermetic so integration failures are not network flakes.
      REGISTRY_SKIP_NETWORK: "1"
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install just
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just@1.58.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Lua 5.4 (official plugin runtime baseline)
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends lua5.4
        timeout-minutes: 5
      - name: Run quality gates
        run: just check
        timeout-minutes: 10
      - name: Run cross-submodule integration smoke
        run: just integration-smoke
        timeout-minutes: 10
      - name: Record integration depth honestly
        run: |
          {
            echo "## Plugin integration depth"
            echo ""
            echo "- SDK, template, and official plugin submodules are checked out at pinned revisions and run their own repository gates."
            echo "- The Bitty core host is not available yet, so no plugin is installed or activated in a real host; this is not host-level integration evidence."
            echo "- Host-level integration is tracked in TODO.md and will replace this smoke once core wiring lands."
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
