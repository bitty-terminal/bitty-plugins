name: Registry check

on:
  pull_request:
    paths:
      - "registry/**"
      - "plugins/**"
      - "scripts/**"
      - "tests/**"
      - "generated/**"
      - "package.json"
      - "bun.lock"
      - "justfile"
      - ".github/workflows/registry-check.yml"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "plugins/**"
      - "scripts/**"
      - "tests/**"
      - "generated/**"
      - "package.json"
      - "bun.lock"
      - "justfile"
      - ".github/workflows/registry-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Registry check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: just@1.58.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate registry
        run: just registry-validate
      - name: Fail on a stale generated index
        run: |
          just registry-generate
          git diff --exit-code -- generated/registry.json
      - name: Run registry tests
        run: just test
