# Official registry entry: Bitty Dashboard.
#
# Hand-maintained identity data only. Derived metadata (version, stars, dates,
# downloads) is intentionally absent; `just registry-sync` mirrors the plugin's
# bitty-plugin.toml into the optional `metadata` object of the generated index.
#
# Integrity (official shipping pin, required): `manifest_hash` is the sha256
# digest (H-A: raw bytes) of the owning repository's `bitty-plugin.toml` at
# the pinned submodule revision recorded by `git ls-tree HEAD plugins/dashboard`.
# `just registry-validate` verifies this digest at the pin. This is a digest
# over fetched transport bytes (H-A), not semantic canonical hashing (H-B).
# Refresh it when the pin moves (see README "Registry model" refresh procedure).

id = "bitty-terminal.dashboard"
name = "Dashboard"
repository = "https://github.com/bitty-terminal/dashboard"
kind = "plugin"
author = "bitty-terminal"
description = "Read-only configuration and status dashboard over bitty.runtime.inspect(): plugins, extensions, settings, profiles, and diagnostics in one panel."
tags = ["dashboard", "status", "configuration", "diagnostics", "inspector"]
categories = ["productivity"]
license = "MIT"
manifest_hash = "sha256:05e56da4a4eaac51cf53d87cfab93a71ba21541c456d7ed992e163e15d9e8c4f"

[compatibility]
bitty = ">=0.0.26"
sdk = "^1.0"
