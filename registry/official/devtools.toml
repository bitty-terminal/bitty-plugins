# Official registry entry: Bitty DevTools.
#
# Hand-maintained identity data only. Derived metadata (version, stars, dates,
# downloads) is intentionally absent; `just registry-sync` mirrors the plugin's
# bitty-plugin.toml into the optional `metadata` object of the generated index.
#
# Integrity (official shipping pin, required): `manifest_hash` is the sha256
# digest (H-A: raw bytes) of the owning repository's `bitty-plugin.toml` at
# the pinned submodule revision recorded by `git ls-tree HEAD plugins/devtools`.
# `just registry-validate` verifies this digest at the pin. This is a digest
# over fetched transport bytes (H-A), not semantic canonical hashing (H-B).
# Refresh it when the pin moves (see README "Registry model" refresh procedure).

id = "bitty-featured.devtools"
name = "Bitty DevTools"
repository = "https://github.com/bitty-terminal/devtools"
kind = "plugin"
author = "bitty-terminal"
description = "Read-only inspection and event tracing of the Bitty plugin runtime."
tags = ["devtools", "debugging", "tracing", "inspection"]
categories = ["developer-tools"]
license = "MIT"
manifest_hash = "sha256:8dbbab2287687272c12f96d5b8ebc18b8c1f492c08ac422a393a06e990b73267"

[compatibility]
# Mirrors the pinned manifest (plugins/devtools declares minimum-only
# compat.bitty ">=0.0.21" and compat.plugin-api "^1.0").
bitty = ">=0.0.21"
sdk = "^1.0"
