# Official registry entry: Bitty Statusline.
#
# Hand-maintained identity data only. Derived metadata (version, stars, dates,
# downloads) is intentionally absent; `just registry-sync` mirrors the plugin's
# bitty-plugin.toml into the optional `metadata` object of the generated index.
#
# Integrity (Phase 1, advisory): `manifest_hash` is the sha256 digest (H-A: raw
# bytes) of the owning repository's `bitty-plugin.toml` at the pinned submodule
# revision recorded by `git ls-tree HEAD plugins/statusline`. This is a digest
# over fetched transport bytes (H-A), not semantic canonical hashing (H-B).
# Refresh it when the pin moves (see README "Registry model" refresh procedure).

id = "bitty-terminal.statusline"
name = "Statusline"
repository = "https://github.com/bitty-terminal/statusline"
kind = "plugin"
author = "bitty-terminal"
description = "Cwd, mode, Git, and task presentation composed from declarative statusline fragments."
tags = ["statusline", "status-bar", "cwd", "shell"]
categories = ["productivity"]
license = "MIT"
manifest_hash = "sha256:affe52a608efd42d1694be5c76a83e5c73070196a7a2cdca5405cdc6c36b7598"

[compatibility]
# Mirrors the pinned manifest (plugins/statusline declares compat.bitty
# ">=0.1,<1.0" and compat.plugin-api "^1.0"). The entry is listed so the
# package is discoverable, but it is not installable on the 0.0.26 host: the
# host rejects the range and fails closed with an incompatibility diagnostic.
bitty = ">=0.1,<1.0"
sdk = "^1.0"
