# Official registry entry: Bitty Statusline.
#
# Hand-maintained identity data only. Derived metadata (version, stars, dates,
# downloads) is intentionally absent; `just registry-sync` mirrors the plugin's
# bitty-plugin.toml into the optional `metadata` object of the generated index.
#
# Integrity (Phase 1, advisory): `manifest_hash` is the sha256 digest of the
# owning repository's `bitty-plugin.toml` at the pinned submodule revision
# recorded by `git ls-tree HEAD plugins/statusline`. Refresh it when the pin
# moves (see README "Registry model" refresh procedure).

id = "bitty-terminal.statusline"
name = "Statusline"
repository = "https://github.com/bitty-terminal/statusline"
kind = "plugin"
author = "bitty-terminal"
description = "Cwd, mode, Git and task presentation via status-component composition."
