# Official registry entry: Bitty Wheel.
#
# Hand-maintained identity data only. Derived metadata (version, stars, dates,
# downloads) is intentionally absent; `just registry-sync` mirrors the plugin's
# bitty-plugin.toml into the optional `metadata` object of the generated index.
#
# Integrity (Phase 1, advisory): `manifest_hash` is the sha256 digest (H-A: raw
# bytes) of the owning repository's `bitty-plugin.toml` at the pinned submodule
# revision recorded by `git ls-tree HEAD plugins/wheel`. This is a digest
# over fetched transport bytes (H-A), not semantic canonical hashing (H-B).
# Refresh it when the pin moves (see README "Registry model" refresh procedure).

id = "bitty-terminal.wheel"
name = "Wheel"
repository = "https://github.com/bitty-terminal/wheel"
kind = "plugin"
author = "bitty-terminal"
description = "The official Agent Harness plugin for the Bitty terminal (mascot: Bittie the hamster). Pre-implementation scaffold."
manifest_hash = "sha256:991579d3de6aa1924bcd9242dc5561625f04bc5d3c00a42ae5081aa13177e139"
tags = ["agent", "agent-harness", "harness", "ai"]
categories = ["productivity"]
license = "MIT"

[compatibility]
# Mirrors the pinned manifest (plugins/wheel @ 524ce07 declares compat.bitty
# ">=0.5,<1.0"; sha256 of the pinned bytes matches manifest_hash above).
# Headless gate vs host 0.0.22 records this entry as expected-red
# (E_INCOMPATIBLE) pending bitty-terminal/wheel#39 (PR wheel#40 lowers the
# floor to ">=0.0.21,<0.1"; the registry mirror and pin refresh follow that
# merge in a separate reviewed change).
bitty = ">=0.5,<1.0"
sdk = "^0.1"
