# Official registry entry: Bitty File Manager.
#
# Hand-maintained identity data only. Derived metadata (version, stars, dates,
# downloads) is intentionally absent; `just registry-sync` mirrors the plugin's
# bitty-plugin.toml into the optional `metadata` object of the generated index.

id = "bitty-terminal.file-manager"
name = "File Manager"
repository = "https://github.com/bitty-terminal/file-manager"
kind = "plugin"
author = "bitty-terminal"
description = "Tiled Panel file listing, navigation, and preview with fs.read + optional fs.write, bounded 8KiB/32/64 PR-1..12."
tags = ["files", "file-manager", "panel", "navigation", "preview"]
categories = ["productivity"]
license = "MIT"

[compatibility]
bitty = ">=0.1,<1.0"
sdk = "^0.1"
