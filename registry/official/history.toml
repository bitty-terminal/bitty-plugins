# Official registry entry: History.
#
# Hand-maintained identity data only. Derived metadata (version, stars, dates,
# downloads) is intentionally absent; `just registry-sync` mirrors the plugin's
# bitty-plugin.toml into the optional `metadata` object of the generated index.
#
# Integrity (Phase 1, advisory): `manifest_hash` is the sha256 digest (H-A: raw
# bytes) of the owning repository's `bitty-plugin.toml` at the pinned submodule
# revision recorded by `git ls-tree HEAD plugins/history`. This is a digest
# over fetched transport bytes (H-A), not semantic canonical hashing (H-B).
# Refresh it when the pin moves (see README "Registry model" refresh procedure).

id = "bitty-terminal.history"
name = "History"
repository = "https://github.com/bitty-terminal/history"
kind = "plugin"
author = "bitty-terminal"
description = "Opt-in history policy over the public history-read host APIs: scoped bounded snapshot queries over transcript, commands, and own KV with redacted truncated attributed answers or typed denials."
tags = ["history", "transcript", "commands", "kv"]
categories = ["productivity"]
license = "MIT"
manifest_hash = "sha256:f4263dd2af80e8f252b86ca2b2c9a052ced87fa646675d6cac3596e3cde333c5"

[compatibility]
bitty = ">=0.0.24,<0.1"
sdk = "^1.0"
